# Tracks which SCRIPT_VERSION (or, for a forked target, which
# layouts/<target>/ version) each real-world keyboard target currently
# implements. "Target" = one platform + physical-keyboard combination —
# Windows on an ANSI (US) keyboard is a different target from Windows on
# an ISO (EU) keyboard, because the physical key layout genuinely differs
# (ISO has an extra key, a taller Enter, and a shifted \ position).
#
# Three independent version numbers can appear per target:
#   script_version    — which base versions/ release this target tracks
#                        directly (no fork). Mutually exclusive with the
#                        two fields below.
#   layout_version +
#   forked_from_script_version
#                     — set instead of script_version once a target has
#                       its own fork under layouts/<target>/. layout_version
#                       is that fork's own version number; forked_from_
#                       script_version is the base version it diverged
#                       from (so you can tell what it's missing from the
#                       base script going forward).
#   app_version       — that target's own release version for the actual
#                        shipped app/installer (app/build.gradle.kts for
#                        Android, etc.) — moves on platform-only changes
#                        (UI, bug fixes) that don't touch any layout.yaml
#                        at all. Only targets with a real "app" have this.
#
# See TODO.md for targets with no implementation at all yet, and
# layouts/README.md for how/when a target gets its own fork.

targets:
  ubuntu-us-ansi:
    status: implemented
    repo: ubuntu-keyboard
    layout_version: "0.0.6"
    forked_from_script_version: "0.0.6"
    note: >
      Tracked under layouts/ubuntu-us-ansi/v0.0.6/ — identical to base
      0.0.6 today, no actual divergence yet, but given its own version
      number like every other target (see layouts/README.md) rather
      than being a special case that just reads versions/ directly.
      XKB's own keyboard geometry already abstracts ANSI-vs-ISO physical
      key placement for the same symbols file — this is the only Linux
      target that likely needs to exist at all. See TODO.md's
      ubuntu-eu-iso entry.

  android:
    status: implemented
    repo: fava-android-keyboard
    layout_version: "0.0.9"
    forked_from_script_version: "0.0.6"
    app_version: "0.3.2"
    note: >
      Forked at base 0.0.6 (layouts/android/v0.0.9/layout.yaml). v0.0.8
      removes the entire top row (digits/symbols already reachable via
      the ۱۲۳ page or relocated to shift levels), extends row AD to 11
      keys (U becomes ع, a newly-shown key holds ج), and does a large
      pass of symbol relocation on the ۱۲۳ page — currency signs (€ ¥
      ﷼ $), Persian-specific punctuation (٪ ؍ « »), and math symbols
      (+ = -), each placed through a deliberate, cascading reassignment
      rather than left wherever they happened to land. Also adopts the
      base script's ی/یْ split, but swaps which of Y/D gets which
      reading relative to the base script — an intentional Android-only
      divergence. v0.0.9 continues the ۱۲۳-page reassignment (٪ to the
      newly-shown [/AD11 key; : and ؛ become ≈ and ≠; و before backspace
      becomes ✓; N and M become < and >) and replaces U's ع with اْ
      (الف + سکون, matching the existing وْ/یْ combining-mark pattern) —
      ع is dropped from this layout entirely. All Android-specific —
      none of this applies to a physical keyboard. app_version is this
      target's own release version (app/build.gradle.kts), independent
      of layout_version — it moves on Android-only changes (the
      globe/IME-switch key, the RTL-mirrored backspace icon, the
      outline/filled shift-state icon, tap haptics, key-elevation/press
      visual polish, bug fixes) that don't touch any layout.yaml at all.
