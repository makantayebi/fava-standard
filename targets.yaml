# Tracks which SCRIPT_VERSION (or, for a forked target, which
# layouts/<target>/ version) each real-world keyboard target currently
# implements. "Target" = one platform + physical-keyboard combination —
# Windows on an ANSI (US) keyboard is a different target from Windows on
# an ISO (EU) keyboard, because the physical key layout genuinely differs
# (ISO has an extra key, a taller Enter, and a shifted \ position).
#
# Three independent version numbers can appear per target:
#   script_version    — which base versions/ release this target tracks
#                        directly (no fork). Mutually exclusive with the
#                        two fields below.
#   layout_version +
#   forked_from_script_version
#                     — set instead of script_version once a target has
#                       its own fork under layouts/<target>/. layout_version
#                       is that fork's own version number; forked_from_
#                       script_version is the base version it diverged
#                       from (so you can tell what it's missing from the
#                       base script going forward).
#   app_version       — that target's own release version for the actual
#                        shipped app/installer (app/build.gradle.kts for
#                        Android, etc.) — moves on platform-only changes
#                        (UI, bug fixes) that don't touch any layout.yaml
#                        at all. Only targets with a real "app" have this.
#
# See TODO.md for targets with no implementation at all yet, and
# layouts/README.md for how/when a target gets its own fork.

targets:
  ubuntu-us-ansi:
    status: implemented
    repo: ubuntu-keyboard
    layout_version: "0.0.5"
    forked_from_script_version: "0.0.5"
    note: >
      Tracked under layouts/ubuntu-us-ansi/v0.0.5/ — identical to base
      0.0.5 today, no actual divergence yet, but given its own version
      number like every other target (see layouts/README.md) rather
      than being a special case that just reads versions/ directly.
      XKB's own keyboard geometry already abstracts ANSI-vs-ISO physical
      key placement for the same symbols file — this is the only Linux
      target that likely needs to exist at all. See TODO.md's
      ubuntu-eu-iso entry.

  android:
    status: implemented
    repo: fava-android-keyboard
    layout_version: "0.0.7"
    forked_from_script_version: "0.0.5"
    app_version: "0.3.0"
    note: >
      Forked at base 0.0.5 (layouts/android/v0.0.7/layout.yaml). v0.0.7
      relocates shift to AB01 (left of ژ) and ZWNJ to the function row
      (right of space), removes two keys to make room (the dedicated
      function-row delete, redundant since 0.0.6's backspace key; the
      dot key, redundant since 0.0.6's shift+AB06), adds shift+ه as a
      second home for the shadda, and adds a ۱۲۳ page (numbers/symbols
      on the AD/AC rows only). All Android-specific — a physical
      keyboard doesn't need a page toggle or benefit from relocating a
      dedicated shift key. app_version is this target's own release
      version (app/build.gradle.kts), independent of layout_version —
      it moves on Android-only changes (the globe/IME-switch key, bug
      fixes) that don't touch any layout.yaml at all.
