version: "0.0.4"
name: "Fava (فاوآیی)"
date: 2026-11-17
supersedes: "0.0.3"
summary: >
  و is multi-valued (consonant /v/ vs. vowel /uː/) with no written way
  to tell them apart. Resolved by repurposing سکون (sukun) — retired
  everywhere else in Fava, since it's barely ever written in real
  Persian anyway — as a dedicated marker meaning "the preceding و is
  the vowel /uː/, not the consonant." Bare و stays the consonant
  default. Assigned to the freed B key. See notes.md.

keys:
